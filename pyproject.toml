[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenderpilot"
version = "0.1.0"
description = "Système multi-agents d'analyse d'appels d'offres (LangGraph, MCP, LLM)"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "mcp>=2.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40", "pandas>=2.2"]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
